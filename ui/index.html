<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LatentMovement | Starting Engine</title>
    <style>
        :root {
            --bg-color: #080812;
            --accent-primary: #00f0ff;
            --accent-secondary: #b800ff;
            --text-main: #e2e8f0;
            --text-muted: #8a8fba;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(184, 0, 255, 0.25) 0%, transparent 60%),
                radial-gradient(circle at 80% 70%, rgba(0, 240, 255, 0.25) 0%, transparent 60%);
        }

        .loader-card {
            background: rgba(18, 18, 35, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            padding: 48px;
            text-align: center;
            max-width: 480px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 240, 255, 0.15);
            backdrop-filter: blur(12px);
            animation: fadeIn 0.6s ease-out;
        }

        .logo-badge {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            color: #fff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.4);
            animation: pulse 2s infinite ease-in-out;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        .progress-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
            margin-bottom: 16px;
        }

        .progress-bar {
            position: absolute;
            height: 100%;
            width: 45%;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 999px;
            animation: progressSweep 1.6s infinite ease-in-out;
            box-shadow: 0 0 12px var(--accent-primary);
        }

        .status {
            font-size: 12px;
            color: var(--accent-primary);
            font-weight: 500;
            font-family: monospace;
        }

        @keyframes progressSweep {
            0% { left: -50%; width: 30%; }
            50% { left: 30%; width: 50%; }
            100% { left: 110%; width: 30%; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="loader-card">
        <div class="logo-badge">M</div>
        <h1>LATENT MOVEMENT</h1>
        <div class="subtitle">AI Infinite Motion & Single Image Studio</div>

        <div class="progress-track">
            <div class="progress-bar"></div>
        </div>

        <div class="status" id="status-text">Booting Local PyTorch Engine...</div>
    </div>

    <script>
        const statusEl = document.getElementById('status-text');
        let attempts = 0;

        async function pollServer() {
            attempts++;
            try {
                const res = await fetch('http://127.0.0.1:5002/api/models');
                if (res.ok) {
                    statusEl.textContent = 'Engine Ready! Launching Studio...';
                    setTimeout(() => {
                        window.location.replace('http://127.0.0.1:5002');
                    }, 250);
                    return;
                }
            } catch (err) {
                if (attempts > 15) {
                    statusEl.textContent = 'Initializing deep neural weights... please wait.';
                } else {
                    statusEl.textContent = 'Connecting to Local Engine (127.0.0.1:5002)...';
                }
            }
            setTimeout(pollServer, 500);
        }

        pollServer();
    </script>
</body>
</html>
